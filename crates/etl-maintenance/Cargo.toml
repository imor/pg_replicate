[package]
name = "etl-maintenance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
doctest = false

[features]
default = ["tls-rustls-ring", "bundled"]
bundled = ["duckdb?/bundled", "duckdb?/json", "duckdb?/parquet"]
tls-rustls-ring = ["sqlx/tls-rustls-ring", "etl/tls-rustls-ring"]
tls-rustls-aws-lc-rs = ["sqlx/tls-rustls-aws-lc-rs", "etl/tls-rustls-aws-lc-rs"]
ducklake = [
    "dep:duckdb",
    "dep:kube",
    "dep:metrics",
    "dep:parse-size",
    "dep:pg_escape",
    "dep:r2d2",
    "dep:regex",
    "dep:serde_json",
    "dep:tokio-postgres",
    "dep:url",
]
test-utils = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
duckdb = { workspace = true, optional = true, features = ["r2d2"] }
etl = { workspace = true }
etl-config = { workspace = true }
kube = { workspace = true, optional = true, features = ["client", "rustls-tls"] }
metrics = { workspace = true, optional = true }
parse-size = { workspace = true, optional = true }
pg_escape = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true, features = ["arbitrary_precision", "std"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "migrate", "chrono"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-postgres = { workspace = true, optional = true }
tracing = { workspace = true, default-features = true }
url = { workspace = true, optional = true }

[dev-dependencies]
k8s-openapi = { workspace = true, features = ["latest"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
